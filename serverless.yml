service: very-vulnerable-serverless

provider:
  name: aws
  runtime: python3.12
  architecture: arm64
  region: us-east-1
  stage: dev
  environment:
    VARIABLE_1: supersecret99
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:*
          Resource: "*"

custom:
  wsgi:
    app: app.app
  pythonRequirements:
    usePipenv: false

package:
  individually: true
  patterns:
    - "!venv/**"
    - "!.venv/**"
    - "!node_modules/**"
    - "!.git/**"
    # The AWS CLI installer unzipped in the lab folder pushes the function past
    # Lambda's 250 MB unzipped limit.
    - "!aws/**"
    - "!awscliv2.zip"
    - "!.serverless/**"
    - "app.py"
    - "requirements.txt"
    - "templates/**"

plugins:
  - serverless-python-requirements
  - serverless-wsgi

functions:
  app:
    handler: wsgi_handler.handler
    events:
      - http: ANY /
      - http: ANY /{proxy+}
